name: Build WordQuiz Pro

on:
  push:
    branches: [main]
    tags: ['v*']          # Attiva la build anche quando crei un tag (es. v1.0.0)
  workflow_dispatch:      # Permette di avviare la build manualmente se serve

# Evita deploy simultanei della PWA che potrebbero sovrascriversi
concurrency:
  group: wordquiz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write         # Necessario per creare Releases e caricare artefatti
  pages: write            # Necessario per GitHub Pages
  id-token: write         # Necessario per GitHub Pages

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: PWA → GitHub Pages + Artefatto scaricabile
  # ═══════════════════════════════════════════════════════════════
  pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione cache del service worker
        run: sed -i "s/wordquiz-v1/wordquiz-${GITHUB_SHA::8}/" www/sw.js

      - name: Upload artefatto PWA
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-PWA
          path: www
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: dep
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: ANDROID → Compila e firma l'APK
  # ═══════════════════════════════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Controllo segreti
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Manca il secret KEYSTORE_BASE64"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - run: npx cap add android

      - name: versionCode crescente
        run: sed -i -E "s/versionCode[ =]+1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - run: npx capacitor-assets generate --android

      - run: npx cap sync android

      - name: Compila APK (non firmato)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Allinea e firma APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out WordQuizPro.apk aligned.apk
          "$BT/apksigner" verify --print-certs WordQuizPro.apk

      - name: Upload artefatto APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-APK
          path: WordQuizPro.apk
          if-no-files-found: error

      - name: Pubblica APK nelle Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WordQuizPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: WINDOWS → Compila gli eseguibili (.exe)
  # ═══════════════════════════════════════════════════════════════
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 👇 CORREZIONE CHIAVE: "--publish never" impedisce a electron-builder 
      # di cercare di pubblicare da solo, evitando l'errore del token.
      - run: npx electron-builder --win --x64 --publish never

      - name: Upload artefatto Windows
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Pubblica Windows nelle Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build WordQuiz Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Prepara sintesi vocale
        run: npm run build:tts

      - name: Aggiorna versione cache
        run: sed -i "s/wordquiz-v1/wordquiz-${GITHUB_SHA::8}/" www/sw.js

      - name: Carica artefatto PWA
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-PWA-ZIP
          path: www
          if-no-files-found: error

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara pubblicazione GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Controlla segreto di firma
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Manca il secret KEYSTORE_BASE64"; exit 1; }

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install

      - name: Prepara sintesi vocale
        run: npm run build:tts

      - name: Aggiungi Android
        run: npx cap add android

      - name: Imposta versionCode
        run: sed -i -E "s/versionCode[ =]+1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Genera risorse Android
        run: npx capacitor-assets generate --android

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Allinea e firma APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out WordQuizPro.apk aligned.apk
          "$BT/apksigner" verify --print-certs WordQuizPro.apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-apk
          path: WordQuizPro.apk

  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Compila Windows
        run: npm run win

      - name: Carica programmi Windows
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-windows
          path: dist/*.exe

  # ═══════════════════════════════════════════════════════════════
  # JOB 1: PWA → GitHub Pages + Artefatto scaricabile
  # ═══════════════════════════════════════════════════════════════
  pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione cache del service worker
        run: sed -i "s/wordquiz-v1/wordquiz-${GITHUB_SHA::8}/" www/sw.js

      # 👇 1. Questo è per TE: ha un nome UNICO, non entrerà in conflitto
      - name: Upload artefatto PWA (per download manuale)
        uses: actions/upload-artifact@v4
        with:
          name: WordQuizPro-PWA-ZIP
          path: www
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 👇 2. Questo è per GITHUB: crea automaticamente l'artefatto "github-pages"
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
